<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340" role="img" aria-label="Demonstração animada do fluxo /init, /executar e /end">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; }
    .cmd { fill: #E2E8F0; font-weight: 700; }
    .prompt { fill: #38BDF8; font-weight: 700; }
    .muted { fill: #94A3B8; }
    .ok { fill: #34D399; font-weight: 600; }
    .warn { fill: #FBBF24; }
    .accent { fill: #C084FC; font-weight: 600; }

    @keyframes step1 { 0%, 4% { opacity: 0; } 8%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes step2 { 0%, 16% { opacity: 0; } 20%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes step3 { 0%, 34% { opacity: 0; } 38%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes step4 { 0%, 50% { opacity: 0; } 54%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes step5 { 0%, 66% { opacity: 0; } 70%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes step6 { 0%, 78% { opacity: 0; } 82%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

    .s1 { animation: step1 11s infinite; }
    .s2 { animation: step2 11s infinite; }
    .s3 { animation: step3 11s infinite; }
    .s4 { animation: step4 11s infinite; }
    .s5 { animation: step5 11s infinite; }
    .s6 { animation: step6 11s infinite; }
    .cursor { animation: blink 1s infinite; }
  </style>

  <!-- Window frame -->
  <rect width="820" height="340" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <path d="M0 14 Q0 0 14 0 L806 0 Q820 0 820 14 L820 40 L0 40 Z" fill="#1E293B"/>

  <!-- 3 window dots -->
  <circle cx="24" cy="20" r="6" fill="#EF4444"/>
  <circle cx="44" cy="20" r="6" fill="#F59E0B"/>
  <circle cx="64" cy="20" r="6" fill="#10B981"/>
  <text x="410" y="25" text-anchor="middle" class="mono muted" font-size="12">dev-previsivel — fluxo de sessão</text>

  <!-- Step 1: /init -->
  <g class="s1">
    <text x="26" y="74" class="mono"><tspan class="prompt">❯ </tspan><tspan class="cmd">/init</tspan></text>
  </g>
  <g class="s2">
    <text x="44" y="98" class="mono muted">Última sessão: <tspan class="accent">bad2bbf</tspan> · 1 commit novo detectado (<tspan class="warn">.agents/03_business_rules_and_logic.md</tspan>)</text>
    <text x="44" y="120" class="mono muted">Backlog: 1 Done · 0 In Progress · 3 To Do → Próxima: <tspan class="ok">/executar BACK-002</tspan></text>
  </g>

  <!-- Step 2: /executar -->
  <g class="s3">
    <text x="26" y="158" class="mono"><tspan class="prompt">❯ </tspan><tspan class="cmd">/executar BACK-002</tspan></text>
  </g>
  <g class="s4">
    <text x="44" y="182" class="mono muted">Branch <tspan class="accent">issue-1</tspan> · Docs e stack lidos · Implementado escopo da task</text>
    <text x="44" y="204" class="mono ok">✓ checks: lint OK · test (12/12) OK · critérios de aceite atendidos</text>
  </g>

  <!-- Step 3: /end -->
  <g class="s5">
    <text x="26" y="242" class="mono"><tspan class="prompt">❯ </tspan><tspan class="cmd">/end</tspan></text>
  </g>
  <g class="s6">
    <text x="44" y="266" class="mono ok">✓ backlog.md → Done · commit BACK-002 · sessions.md atualizado · push origin/issue-1</text>
    <text x="26" y="302" class="mono"><tspan class="prompt">❯ </tspan><tspan class="muted">Pronto para a próxima: /executar BACK-003 </tspan><tspan class="cursor prompt">█</tspan></text>
  </g>
</svg>
