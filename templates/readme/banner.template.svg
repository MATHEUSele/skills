<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="{{TITULO}} — {{SUBTITULO}}">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B0764"/>
      <stop offset="48%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>

  <!-- Brilhos decorativos -->
  <circle cx="1030" cy="60" r="180" fill="#38BDF8" fill-opacity="0.16"/>
  <circle cx="160" cy="260" r="140" fill="#A855F7" fill-opacity="0.18"/>

  <!-- Emblema à esquerda (personalize o ícone mantendo fontes de sistema) -->
  <rect x="76" y="72" width="156" height="156" rx="28" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5"/>
  <text x="112" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="68" font-weight="700" fill="#E0E7FF">{</text>
  <text x="172" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="68" font-weight="700" fill="#E0E7FF">}</text>
  <path d="M137 152 L149 164 L173 134" fill="none" stroke="#34D399" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Título e subtítulo -->
  <text x="268" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">{{TITULO}}</text>
  <text x="270" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#E0F2FE">{{SUBTITULO}}</text>

  <!-- Pills / tags (ajuste larguras ao tamanho do texto) -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600">
    <rect x="270" y="202" width="140" height="30" rx="15" fill="#0F172A" fill-opacity="0.45" stroke="#93C5FD" stroke-opacity="0.4"/>
    <text x="340" y="222" text-anchor="middle" fill="#BAE6FD">{{TAG_1}}</text>

    <rect x="422" y="202" width="140" height="30" rx="15" fill="#0F172A" fill-opacity="0.45" stroke="#C4B5FD" stroke-opacity="0.4"/>
    <text x="492" y="222" text-anchor="middle" fill="#DDD6FE">{{TAG_2}}</text>

    <rect x="574" y="202" width="140" height="30" rx="15" fill="#0F172A" fill-opacity="0.45" stroke="#6EE7B7" stroke-opacity="0.4"/>
    <text x="644" y="222" text-anchor="middle" fill="#A7F3D0">{{TAG_3}}</text>
  </g>
</svg>
